services:
  - type: web
    name: monte-carlo-proxy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://tonesmihai-art.github.io
      - key: FINNHUB_KEY
        sync: false   # valoarea se seteaza manual in Render dashboard (nu se comite in repo)
